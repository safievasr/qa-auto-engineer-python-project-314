name: Python CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # make depends on uv
      - name: Install dependencies
        run: |
          pip install uv
          make install
      - name: Start application
        run: |
          docker run --detach --name kanban-app -p 5173:5173 hexletprojects/qa_auto_python_testing_kanban_board_project_ru_app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs kanban-app
          exit 1
      - name: Run linter
        run: make lint
      - name: Run test coverage
        run: make test-coverage
