name: quality

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: make lint

      - name: Start test application
        run: |
          docker run --detach --rm --name qa-kanban-app -p 5173:5173 \
            hexletprojects/qa_auto_python_testing_kanban_board_project_ru_app
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs qa-kanban-app
          exit 1

      - name: Run tests with coverage
        env:
          HEADLESS: "1"
        run: uv run pytest --cov=core --cov=pages --cov=data --cov-report=xml:coverage.xml

      - name: Stop test application
        if: always()
        run: |
          if docker container inspect qa-kanban-app >/dev/null 2>&1; then
            docker stop qa-kanban-app
          fi

      - name: SonarCloud scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
